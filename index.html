<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html {
    background-color: #ff7f00;
    padding: 10px;
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: calc(100vh - 20px);
    background-color: #000000;
    color: orange;
    font-family: Arial, sans-serif;

    border-radius: 25px;
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;
}

.textbox {
    text-align: center;
    padding: 20px;
}

h3 {
    font-size: 24px;
    margin-bottom: 20px;
}

ul {
    list-style: none;
    padding: 0;
    margin: 0;
}

li {
    font-size: 1.2em;
}

a {
    color: #ffcc80;
    text-decoration: none;
    font-weight: bold;
    transition: color 0.3s;
}

a:hover {
    color: #ff7f00;
}
</style>

<title>Gewinnspiel</title>
</head>
<body>

<div class="textbox">
    <h3>Hier kannst du Schätze aus unserem Gewinnspiel gewinnen!</h3>
    <ul>
        <li>
            🎉 <a href="https://sites.google.com/view/sunnysschaetze/home/formulare/gewinnspiel" target="_blank">
                Zum Gewinnspiel
            </a>
        </li>
    </ul>
</div>

</body>
</html>
