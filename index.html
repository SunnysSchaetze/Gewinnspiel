<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gewinnspiel</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
html {
  height: 100%;
  margin: 0;
  padding: 2px;
  box-sizing: border-box;
  background-color: #ff7f00;
}

* {
  box-sizing: border-box;
}

body {
  width: 100%;
  height: 100%;
  margin: 0;

  font-family: Arial, sans-serif;
  background-color: #000;
  color: orange;

  border-radius: 25px;
  overflow: hidden;

  display: flex;
  justify-content: center;
  align-items: center;
}

.textbox{
    text-align:center;
    padding:15px;
}

h3{
    font-size:18px;
    margin-bottom:25px;
}

/* BUTTON */
.gift-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:8px 12px;
    border:2px solid #ff7f00;
    border-radius:10px;
    color:#ffcc80;
    text-decoration:none;
    font-weight:bold;
    font-size:0.9em;
    background:transparent;
    box-shadow:0 0 12px rgba(255,127,0,.45);
    transition:0.3s ease;
}

.gift-btn:hover{
    box-shadow:0 0 22px rgba(255,127,0,.9);
    border-color:#ff9a2f;
    transform:scale(1.03);
    color:#ff7f00;
}

ul{
    list-style:none;
    padding:0;
    margin:0;
}

#overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    display:flex;
    justify-content:center;
    align-items:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
}

#overlay.active{
    opacity:1;
    pointer-events:all;
}

.scene{
    position:relative;
    width:320px;
    height:320px;
}

.gift-box{
    width:160px;
    height:160px;
    position:absolute;
    left:50%;
    bottom:40px;
    transform:translateX(-50%);
}

.box{
    width:100%;
    height:100%;
    position:absolute;
    bottom:0;
    background:linear-gradient(135deg,#ffcb7d,#ffab2d,#ff7f00);
    border-radius:16px;
    box-shadow:0 15px 30px rgba(0,0,0,.5),
               inset 0 3px 8px rgba(255,255,255,.25);
}

/* Deckel bündig */
.lid{
    width:100%;
    height:40px;
    position:absolute;
    left:0;
    top:0;
    background:linear-gradient(135deg,#ffd38d,#ff9f1a);
    border-radius:14px;
    box-shadow:0 10px 20px rgba(0,0,0,.45),
               inset 0 3px 6px rgba(255,255,255,.35);
    transform-origin:left center;
    transition:transform 1s cubic-bezier(.2,.9,.2,1);
    z-index:20;
}

.open .lid{
    transform:perspective(1200px) rotateX(-115deg) rotateZ(55deg) translateX(95px) translateY(-55px);
}

.ribbon-vertical{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    width:22px;
    height:100%;
    background:linear-gradient(to right,#b80000,#ff2a2a,#b80000);
    border-radius:8px;
    z-index:2;
}

.ribbon-horizontal{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:100%;
    height:22px;
    background:linear-gradient(to bottom,#b80000,#ff2a2a,#b80000);
    border-radius:8px;
    z-index:2;
}

/* Schleife mittig auf dem Deckel */
.bow{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:130px;
    height:120px;
    transition:transform 1s ease;
    z-index:30;
}

.open .bow{
    transform:translate(-50%,-50%) rotate(-10deg) scale(0.98);
}

.bow-left,
.bow-right{
    position:absolute;
    width:55px;
    height:55px;
    background:linear-gradient(135deg,#ff5050,#c00000);
    box-shadow:0 5px 10px rgba(0,0,0,.3), inset 2px 2px 5px rgba(255,255,255,.25);
}

.bow-left{
    left:2px;
    top:2px;
    border-radius:85% 85% 20% 85%;
    transform:rotate(-35deg);
}

.bow-right{
    right:2px;
    top:2px;
    border-radius:85% 85% 85% 20%;
    transform:rotate(35deg);
}

.bow-center{
    position:absolute;
    width:24px;
    height:24px;
    left:50%;
    top:18px;
    transform:translateX(-50%);
    border-radius:50%;
    background:radial-gradient(circle,#ff8b8b,#990000);
    box-shadow:0 3px 6px rgba(0,0,0,.4);
    z-index:40;
}

.ribbon-tail-left,
.ribbon-tail-right{
    position:absolute;
    width:12px;
    height:75px;
    top:28px;
    left:50%;
    background:linear-gradient(to bottom,#ff2f2f,#a80000);
    border-radius:5px;
    transform-origin:top center;
}

.ribbon-tail-left{
    transform:translateX(-50%) rotate(30deg);
}

.ribbon-tail-right{
    transform:translateX(-50%) rotate(-30deg);
}

.ribbon-tail-left::after,
.ribbon-tail-right::after{
    content:"";
    position:absolute;
    left:0;
    bottom:-1px;
    width:100%;
    height:14px;
    background:#000;
    clip-path:polygon(0 0,35% 100%,50% 65%,65% 100%,100% 0);
}
</style>
</head>

<body>

<div class="textbox">
<h3>Hier kannst du Schätze aus unserem Gewinnspiel gewinnen!</h3>

<ul>
<li>
<a class="gift-btn" href="#" onclick="openGift(event)">
🎉 Gewinnspiele
</a>
</li>
</ul>
</div>

<div id="overlay">
    <div class="scene">
        <div class="gift-box" id="giftBox">
            <div class="lid">
                <div class="bow">
                    <div class="bow-left"></div>
                    <div class="bow-right"></div>
                    <div class="bow-center"></div>
                    <div class="ribbon-tail-left"></div>
                    <div class="ribbon-tail-right"></div>
                </div>
            </div>

            <div class="box"></div>
            <div class="ribbon-vertical"></div>
            <div class="ribbon-horizontal"></div>
        </div>
    </div>
</div>

<script>
function openGift(event){
    event.preventDefault();

    const overlay=document.getElementById("overlay");
    const box=document.getElementById("giftBox");

    overlay.classList.add("active");

    setTimeout(()=>box.classList.add("open"),300);

    setTimeout(()=>{
        confetti({
            particleCount:170,
            spread:110,
            startVelocity:40,
            origin:{x:0.5,y:0.45}
        });
    },1200);

    setTimeout(()=>{
        window.top.location.href =
"https://www.sunnysschaetze.de/home/formulare/gewinnspiel";
        overlay.classList.remove("active");
        box.classList.remove("open");
    },2200);
}
</script>

</body>
</html>
